services:
  elasticsearch:
    image: elasticsearch:8.18.2
    ports: 
      - 9200:9200
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false

  postgres:
    image: postgres:latest
    environment:
      POSTGRES_DB: ${PG_DB}
      POSTGRES_PASSWORD: ${PG_PASS}
      POSTGRES_USER: ${PG_USER}
    ports:
      - 5432:5432