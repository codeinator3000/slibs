services:
  elasticsearch:
    image: elasticsearch:8.17.4
    ports: 
      - 9200:9200
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
   
  postgres:
    image: 'postgres:latest'
    environment:
      - 'POSTGRES_DB=main_database'
      - 'POSTGRES_PASSWORD=secret'
      - 'POSTGRES_USER=myuser'
    ports:
      - '5432'